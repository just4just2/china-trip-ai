<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Переводчик 中文</title>
<style>
  :root { color-scheme: light dark; font: 17px/1.4 system-ui, sans-serif; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; }
  header { display: flex; gap: 8px; align-items: start; padding: 8px 16px; max-height: 55dvh; overflow-y: auto; flex-shrink: 0; }
  header details { flex: 1; min-width: 0; }
  header input, header textarea { display: block; width: 100%; box-sizing: border-box; margin-top: 6px; font: inherit; }
  header label { display: block; margin-top: 12px; }
  header textarea { min-height: 100px; resize: vertical; }
  .voiceTests { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .speechStatus { margin: 0; padding: 8px 16px; overflow-wrap: anywhere; }
  #log { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px; }
  .msg { margin: 8px 0; padding: 8px 12px; border-radius: 12px; background: #8882; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg small { display: block; opacity: .7; }
  .msg b { font-size: 1.5em; font-weight: 600; }
  .msg img { display: block; max-width: 100%; max-height: 200px; margin-top: 6px; border-radius: 8px; }
  .ru, .user { margin-left: 15%; background: #3a7bd533; }
  .err { background: #e333; }
  .msg[role=button] { cursor: pointer; }
  .msg.pin::before { content: '⭐'; display: block; }
  body.pins .msg:not(.pin) { display: none; }
  #pinHint { padding: 16px; }
  button[aria-pressed=true] { background: #3a7bd555; }
  :focus-visible { outline: 3px solid #397dd1; outline-offset: 3px; }
  #card { box-sizing: border-box; width: 100%; max-width: none; height: 100dvh; max-height: none; margin: 0; border: 0; padding: 0; background: Canvas; color: CanvasText; }
  #card[open] { display: flex; flex-direction: column; }
  #cardLines { flex: 1; overflow-y: auto; padding: max(24px, env(safe-area-inset-top)) 24px 24px; }
  .cardLine { display: flex; align-items: center; gap: 8px; margin: 0 0 24px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .cardLine > :first-child { min-width: 0; flex: 1; }
  .cardLine.zh { font-size: min(12vw, 96px); line-height: 1.25; }
  .cardLine button { font: inherit; text-align: left; padding: 0; background: none; touch-action: manipulation; }
  .cardLine .icon { flex-shrink: 0; display: inline-block; font-size: 28px; padding: 8px; }
  #cardActions { display: flex; justify-content: space-between; gap: 16px; padding: 16px 24px max(16px, env(safe-area-inset-bottom)); }
  footer { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); }
  .row { grid-column: 1 / -1; display: flex; gap: 8px; }
  #inp { flex: 1; min-width: 0; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid #8888; }
  button, label.btn { font: inherit; border: 0; border-radius: 12px; background: #8883; padding: 10px 14px;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  footer > button { padding: 18px 8px; font-size: 1.1em; }
  .rec { background: #e33 !important; color: #fff; }
</style>
</head>
<body>
<header>
  <details id="settings">
    <summary>⚙️ Настройки</summary>
    <div class="voiceTests"><small>Версия 2026.09.28.4</small><button id="updateApp">Обновить приложение</button></div>
    <small id="updateState" role="status"></small>
    <div class="voiceTests">
      <button id="testRu">🔊 Русский</button>
      <button id="testZh">🔊 中文</button>
    </div>
    <small id="voiceState" role="status"></small>
    <input id="url" list="urls" value="https://openrouter.ai/api/v1/chat/completions" aria-label="API URL">
    <input id="key" type="password" placeholder="API-ключ (sk-or-…)" aria-label="API-ключ" autocomplete="off">
    <input id="model" list="models" value="qwen/qwen3.8-omni-flash, xiaomi/mimo-v2.6-flash" aria-label="Модели через запятую, вторая и далее — запасные">
    <label for="tts">🔊 Голос 中文 через API: модель, голос (пусто — голос телефона)</label>
    <input id="tts" value="qwen/qwen-audio-3.0-tts-flash, longanhuan_v3.6">
    <label for="amodel">Модель ассистента</label>
    <input id="amodel" value="xiaomi/mimo-v2.6-pro, qwen/qwen3.8-omni-flash">
    <label for="rate">💱 Рублей за 1 ¥</label>
    <input id="rate" inputmode="decimal" placeholder="пусто — цены не пересчитывать">
    <label for="mem">🧠 Память</label>
    <textarea id="mem" placeholder="Город, отель (адрес по-китайски), даты, аллергии, «цены в рублях»…"></textarea>
    <datalist id="urls"><option value="https://openrouter.ai/api/v1/chat/completions"><option value="https://api.deepseek.com/chat/completions"></datalist>
    <datalist id="models"><option value="qwen/qwen3.8-omni-flash, xiaomi/mimo-v2.6-flash"><option value="deepseek/deepseek-v4.1-flash"><option value="deepseek-chat"></datalist>
  </details>
  <button id="pins" aria-label="Только закладки" aria-pressed="false">⭐</button>
  <button id="clear" aria-label="Удалить всё, кроме закладок">🗑</button>
</header>
<main id="log"><p id="pinHint" hidden>Тап по фразе → ☆</p></main>
<p id="speechStatus" class="speechStatus" role="status" hidden></p>
<footer>
  <button class="talk" data-mode="ru">🇷🇺 Держи и говори</button>
  <button class="talk" data-mode="zh">🇨🇳 按住 说话</button>
  <div class="row">
    <label class="btn" aria-label="Фото">📷<input id="cam" type="file" accept="image/*" hidden></label>
    <input id="inp" placeholder="Спросить / перевести…" enterkeyhint="send" aria-label="Текст">
    <button class="talk" data-mode="ask" id="askBtn" aria-label="Спросить">🎤</button>
  </div>
</footer>
<dialog id="card" aria-label="Карточка фразы">
  <div id="cardLines"></div>
  <p id="cardSpeechStatus" class="speechStatus" role="status" hidden></p>
  <div id="cardActions">
    <button id="pinCard" aria-label="Закладка" aria-pressed="false">☆</button>
    <button id="speakCard" aria-label="Повторить озвучку">🔊</button>
    <button id="closeCard" aria-label="Закрыть" autofocus>✕</button>
  </div>
</dialog>
<script>
const $ = id => document.getElementById(id);
const el = (tag, text) => Object.assign(document.createElement(tag), {textContent: text});
const log = $('log'), inp = $('inp');
let hist = readArray('hist').filter(m => m && ['user', 'assistant'].includes(m.role) && typeof m.content == 'string').slice(-20), pending;
let generation = 0, cardEntry, cardNode, closingCard = false;

for (const i of ['url', 'key', 'model', 'tts', 'amodel', 'mem', 'rate'].map($)) {
  try { i.value = localStorage.getItem(i.id) ?? i.value; } catch {}
  i.onchange = () => store(i.id, i.value.trim());
}
$('rate').addEventListener('change', () => { for (const n of log.querySelectorAll('.ru, .zh')) if (n.entry) renderEntry(n.entry, n); });
$('settings').open = !$('key').value;
$('clear').onclick = () => {
  generation++; hist = []; store('hist', hist);
  for (const node of log.querySelectorAll('.msg')) if (!node.entry?.pin) node.remove();
  saveLog();
};
$('pins').onclick = () => setPins(!document.body.classList.contains('pins'));
inp.oninput = () => $('askBtn').textContent = inp.value ? '➤' : '🎤';
inp.onkeydown = e => e.key == 'Enter' && !e.isComposing && ask(take());
$('cam').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try { const photo = await shrink(f); ask(take(), null, photo); }
  catch { add('err', '⚠️ Не удалось открыть фото. Выбери другое изображение.'); }
};
document.oncontextmenu = e => e.target.closest('.talk') && e.preventDefault();
const serviceWorkerReady = navigator.serviceWorker?.register('sw.js', {updateViaCache: 'none'});
serviceWorkerReady?.catch(() => {});
$('updateApp').onclick = async () => {
  $('updateApp').disabled = true; $('updateState').textContent = 'Проверяю обновление…';
  const controller = new AbortController(), timer = setTimeout(() => controller.abort(), 15000);
  try {
    navigator.serviceWorker?.getRegistration().then(r => r?.update()).catch(() => {});
    const response = await fetch(location.href.split('#')[0], {cache: 'reload', signal: controller.signal});
    if (!response.ok) throw new Error('HTTP ' + response.status);
    await response.text();
    location.reload();
  } catch {
    $('updateState').textContent = 'Не удалось обновить. Проверь интернет; сохранённая версия остаётся доступна.';
    $('updateApp').disabled = false;
  } finally { clearTimeout(timer); }
};
try { navigator.storage?.persist?.().catch(() => {}); } catch {}

for (const entry of trimLog(readArray('log').filter(validEntry))) renderEntry(entry);
log.scrollTop = log.scrollHeight;

function readArray(key) {
  try { const value = JSON.parse(localStorage.getItem(key)); return Array.isArray(value) ? value : []; } catch { return []; }
}

function store(key, value) {
  try { localStorage.setItem(key, typeof value == 'string' ? value : JSON.stringify(value)); }
  catch { if (!log.querySelector('.storageError')) add('err storageError', '⚠️ Не удалось сохранить данные на телефоне. Проверь свободное место.'); }
}

function validEntry(e) {
  return e && Number.isFinite(e.t) && (['ru', 'zh'].includes(e.cls)
    ? typeof e.heard == 'string' && typeof e.tr == 'string' && typeof e.lang == 'string'
    : ['user', 'bot'].includes(e.cls) && typeof e.text == 'string');
}

function trimLog(entries) {
  let remaining = 300;
  return entries.slice().reverse().filter(e => e.pin || --remaining >= 0).reverse();
}

function entries() { return [...log.querySelectorAll('.msg')].map(n => n.entry).filter(Boolean); }

function saveLog() {
  const kept = trimLog(entries()), keep = new Set(kept);
  for (const node of log.querySelectorAll('.msg')) if (node.entry && !keep.has(node.entry)) node.remove();
  store('log', kept); updatePins();
}

function updatePins() {
  $('pinHint').hidden = !document.body.classList.contains('pins') || entries().some(e => e.pin);
}

function setPins(on) {
  document.body.classList.toggle('pins', on);
  $('pins').setAttribute('aria-pressed', String(on)); updatePins();
}

function actionable(node, action) {
  node.tabIndex = 0; node.setAttribute('role', 'button'); node.onclick = action;
  node.onkeydown = e => { if (e.key == 'Enter' || e.key == ' ') { e.preventDefault(); action(); } };
}

function renderEntry(entry, node = add(entry.cls, '')) {
  node.entry = entry;
  node.className = 'msg ' + entry.cls + (entry.pin ? ' pin' : '');
  if (entry.cls == 'ru' || entry.cls == 'zh') {
    const rate = parseFloat($('rate').value.replace(',', '.'));
    const rub = rate > 0 ? yuan(entry.heard + ' / ' + entry.tr).map(y => y.toLocaleString('ru-RU') + ' ¥ ≈ ' + Math.round(y * rate).toLocaleString('ru-RU') + ' ₽').join(' · ') : '';
    node.replaceChildren(el('small', entry.heard), el('b', entry.tr), ...rub ? [el('small', '💱 ' + rub)] : []);
  } else node.textContent = entry.text;
  if (entry.cls != 'user') actionable(node, () => openCard(entry, node));
  return node;
}

function cardLines(entry) {
  return (entry.tr != null ? [entry.heard, entry.tr] : [entry.text]).flatMap(t => t.split('\n'))
    .map(t => t.trim()).filter(Boolean).map(text => ({text, zh: /[一-鿿]/u.test(text), place: text.match(/^📍\s*(.+)/u)?.[1] || ''}));
}

// ponytail: only amounts with an explicit currency — bare 块 also means "pieces", so only 块钱 counts.
function yuan(text) {
  const num = String.raw`(\d{1,3}(?:[ \u00a0\u202f,]\d{3})+(?:[.,]\d{1,2})?(?!\d)|\d+(?:[.,]\d{1,2})?)`;
  const re = new RegExp(String.raw`[¥￥]\s*${num}|${num}\s*(?:юан|元|块钱|[¥￥]|rmb|cny)`, 'giu');
  return [...new Set([...text.matchAll(re)].map(m => +(m[1] ?? m[2]).replace(/[ \u00a0\u202f]|,(?=\d{3})/g, '').replace(',', '.')))];
}

// Either button works: the translation's script tells who spoke, the pressed button only breaks ties.
function sourceLang(tr, mode) {
  const zh = /[一-鿿]/u.test(tr), ru = /[а-яё]/iu.test(tr);
  return zh == ru ? mode : zh ? 'ru' : 'zh';
}

function mapUrl(q, ua = navigator.userAgent) {
  return (/iPhone|iPad|Macintosh/.test(ua) ? 'https://maps.apple.com/?q=' : 'https://uri.amap.com/search?keyword=') +
    encodeURIComponent(q.replace(/^📍\s*/u, '').trim()) + (/iPhone|iPad|Macintosh/.test(ua) ? '' : '&callnative=1');
}

function openCard(entry, node) {
  cardEntry = entry; cardNode = node;
  $('cardLines').replaceChildren();
  for (const line of cardLines(entry)) {
    const row = el('p', ''); row.className = 'cardLine' + (line.zh ? ' zh' : '');
    const text = el(line.zh ? 'button' : 'span', line.text);
    if (line.zh) text.onclick = () => say(line.text);
    row.append(text);
    if (line.zh || line.place) { // for pasting into DiDi / Amap / WeChat
      const copy = el('button', '📋'), value = line.place || line.text;
      copy.className = 'icon'; copy.setAttribute('aria-label', 'Копировать: ' + value);
      copy.onclick = async () => {
        try { await navigator.clipboard.writeText(value); copy.textContent = '✅'; } catch { copy.textContent = '⚠️'; }
      };
      row.append(copy);
    }
    if (line.place) {
      const link = el('a', '🗺'); link.className = 'icon'; link.href = mapUrl(line.place);
      link.target = '_blank'; link.rel = 'noopener'; link.setAttribute('aria-label', 'На карте: ' + line.place); row.append(link);
    }
    $('cardLines').append(row);
  }
  updateCardPin();
  $('card').showModal(); $('cardLines').scrollTop = 0;
  history.pushState({card: true}, '', location.href);
  say(entry.tr ?? entry.text, entry.lang);
}

function updateCardPin() {
  $('pinCard').textContent = cardEntry.pin ? '⭐' : '☆';
  $('pinCard').setAttribute('aria-pressed', String(!!cardEntry.pin));
}

$('pinCard').onclick = () => {
  cardEntry.pin = !cardEntry.pin; cardNode.classList.toggle('pin', cardEntry.pin); updateCardPin(); saveLog();
};
$('speakCard').onclick = () => say(cardEntry.tr ?? cardEntry.text, cardEntry.lang);
function closeCard() { if (!closingCard && $('card').open) { closingCard = true; history.back(); } }
$('closeCard').onclick = closeCard;
$('card').oncancel = e => { e.preventDefault(); closeCard(); };
$('card').onclick = e => { if (e.target == $('card') || e.target == $('cardLines')) closeCard(); };
addEventListener('popstate', () => { if ($('card').open) $('card').close(); closingCard = false; });

function remember(mem, answer) {
  const known = new Set(mem.split('\n').map(s => s.trim()));
  for (const line of answer.split('\n')) {
    const fact = line.match(/^🧠\s*(.+)/u)?.[1].trim();
    if (fact && !known.has(fact)) { mem = (mem.trimEnd() ? mem.trimEnd() + '\n' : '') + fact; known.add(fact); }
  }
  return mem;
}

function recentContext(list, now = Date.now()) {
  return list.filter(e => ['ru', 'zh'].includes(e.cls) && now - e.t <= 600000 && e.t <= now).slice(-4)
    .map(e => e.heard + ' → ' + e.tr).join('\n');
}

function take() { const t = inp.value.trim(); inp.value = ''; inp.oninput(); return t; }

function add(cls, text) {
  setPins(false);
  const d = el('div', text);
  d.className = 'msg ' + cls;
  log.append(d); d.scrollIntoView(false);
  return d;
}

// Hold = record voice. Tap with text in the field = send that text instead (keyboard dictation / typing fallback).
for (const b of document.querySelectorAll('.talk')) {
  const run = (text, audio) => b.dataset.mode == 'ask' ? ask(text, audio) : interpret(b.dataset.mode, text, audio);
  b.onpointerdown = e => {
    e.preventDefault();
    hush(); // also drops TTS audio still downloading, so it can't play into the mic
    // iOS unlock only: Android does not need an empty utterance before recording.
    if ('speechSynthesis' in window && /iPhone|iPad|Macintosh/.test(navigator.userAgent)) speechSynthesis.speak(new SpeechSynthesisUtterance(''));
    const text = take();
    if (text) return run(text);
    (pending = record(b)).catch(() => {});
  };
  b.onpointerup = b.onpointercancel = b.onpointerleave = async () => {
    const p = pending; pending = null;
    if (!p) return;
    try {
      const rec = await p; rec.stop();
      const blob = await rec.done;
      if (Date.now() - rec.t0 < 600) return add('err', 'Держи кнопку, пока говоришь');
      run(null, await b64(await toWav(blob)));
    } catch (err) { add('err', '⚠️ ' + err.message); }
    finally { b.classList.remove('rec'); }
  };
}

async function record(b) {
  const stream = await navigator.mediaDevices.getUserMedia({audio: true});
  const rec = new MediaRecorder(stream), chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.done = new Promise(r => rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop()); // mic off, otherwise iOS plays TTS through the quiet earpiece
    r(new Blob(chunks, {type: rec.mimeType}));
  });
  rec.start(); rec.t0 = Date.now(); b.classList.add('rec');
  return rec;
}

// MediaRecorder gives webm (Chrome) or mp4 (Safari); OpenRouter wants wav/mp3 → decode + resample to 16 kHz mono wav.
async function toWav(blob) {
  const buf = await new OfflineAudioContext(1, 1, 16000).decodeAudioData(await blob.arrayBuffer());
  return wav(buf.getChannelData(0), 16000);
}

function wav(pcm, rate) {
  const v = new DataView(new ArrayBuffer(44 + pcm.length * 2));
  const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); v.setUint32(4, 36 + pcm.length * 2, true); str(8, 'WAVEfmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, pcm.length * 2, true);
  pcm.forEach((s, i) => v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, s)) * 0x7fff, true));
  return v.buffer;
}

const b64 = data => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result.split(',')[1]); f.readAsDataURL(new Blob([data])); });

async function shrink(file) {
  const img = await createImageBitmap(file), k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = img.width * k; c.height = img.height * k;
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  img.close();
  return c.toDataURL('image/jpeg', 0.85);
}

const HTTP_ERRORS = {401: 'неверный API-ключ', 402: 'кончились деньги', 403: 'модель недоступна (возможно, из Китая), поменяй её в ⚙', 429: 'слишком часто, подожди'};

// OpenAI-compatible streaming chat. `extra` (reasoning, web search) and model fallbacks are OpenRouter-only.
async function llm(messages, models, extra, onText) {
  const url = $('url').value.trim(), [model, ...backup] = models.split(',').map(s => s.trim()).filter(Boolean);
  const or = url.includes('openrouter.ai');
  const controller = new AbortController();
  let timer, reader;
  // ponytail: 30 seconds includes upload; increase if a photo cannot upload on a slow connection.
  const reset = () => { clearTimeout(timer); timer = setTimeout(() => controller.abort(), 30000); };
  reset();
  try {
    const r = await fetch(url, {
      method: 'POST', signal: controller.signal,
      headers: {Authorization: 'Bearer ' + $('key').value.trim(), 'Content-Type': 'application/json'},
      body: JSON.stringify({model, messages, stream: true, ...(or && backup.length && {models: [model, ...backup]}), ...(or && extra)}),
    });
    if (!r.ok) throw new Error(HTTP_ERRORS[r.status] || r.status + ' ' + (await r.text()).slice(0, 300));
    reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = '', out = '', done = false;
    const consume = line => {
      line = line.trim();
      if (!line.startsWith('data:')) return;
      const data = line.slice(5).trim();
      if (data == '[DONE]') { done = true; return; }
      const j = JSON.parse(data);
      if (j.error) throw new Error(j.error.message || 'ошибка модели');
      const choice = j.choices?.[0], delta = choice?.delta;
      if (choice?.finish_reason == 'error' || choice?.finish_reason == 'length') throw new Error('ответ прерван, попробуй ещё раз');
      out += delta?.content ?? '';
      onText?.(out, !!delta?.reasoning);
    };
    for (let c; !done && !(c = await reader.read()).done;) {
      reset(); // Every chunk counts, including OpenRouter's processing comments.
      const lines = (buf += c.value).split('\n'); buf = lines.pop();
      for (const line of lines) consume(line);
    }
    if (buf.trim()) consume(buf);
    if (!done) throw new Error('ответ прерван, попробуй ещё раз');
    if (!out.trim()) throw new Error('пустой ответ модели');
    return out;
  } catch (e) {
    if (controller.signal.aborted) throw new Error('нет ответа 30 с');
    if (e instanceof TypeError) throw new Error('нет связи');
    throw e;
  } finally {
    clearTimeout(timer);
    if (reader) { await reader.cancel().catch(() => {}); reader.releaseLock(); }
    controller.abort();
  }
}

function parse(out, text = '') {
  try { const j = JSON.parse(out.slice(out.indexOf('{'), out.lastIndexOf('}') + 1)); if (j.tr) return j; } catch {}
  return {heard: text, tr: out.trim()};
}

async function interpret(mode, text, audio) {
  const started = generation;
  const src = mode == 'ru' ? 'Russian' : 'Mandarin Chinese';
  const m = add(mode, text || '🎤 …');
  try {
    const context = recentContext(entries());
    const out = await llm([
      {role: 'system', content: `You are a live interpreter between Russian and Mandarin Chinese. The user message is speech, most likely in ${src}. Translate Russian into Simplified Chinese (Mandarin) and Chinese into Russian. Never answer or comment on it, only translate. Write numbers and prices with digits. Reply with JSON only: {"heard": "<exact transcript in the original language>", "tr": "<natural, polite spoken translation>"}` + (context ? '\nRecent conversation, context only, do not translate:\n' + context : '')},
      {role: 'user', content: audio ? [{type: 'text', text: 'Translate this speech.'}, {type: 'input_audio', input_audio: {data: audio, format: 'wav'}}] : text},
    ], $('model').value, {reasoning: {effort: 'none'}}); // speed over depth for live talk
    if (started != generation) return;
    const {heard, tr} = parse(out, text);
    if (typeof heard != 'string' || typeof tr != 'string' || !tr.trim()) throw new Error('не удалось разобрать перевод');
    const cls = sourceLang(tr, mode), lang = cls == 'ru' ? 'zh-CN' : 'ru-RU';
    renderEntry({cls, heard, tr, lang, t: Date.now(), pin: false}, m); saveLog();
    say(tr, lang);
  } catch (e) {
    if (started != generation) return;
    retry(m, e, () => { m.remove(); interpret(mode, text, audio); });
  }
}

function retry(node, error, run) {
  node.classList.add('err'); node.textContent = '⚠️ ' + error.message + ' — нажми, чтобы повторить';
  actionable(node, run);
}

const ASSIST = 'Ты — помощник туриста из России в Китае. Отвечай по-русски, коротко, без markdown. ' +
  'Для актуальных фактов (транспорт, цены, адреса, часы работы) ищи в интернете. ' +
  'Если нужна фраза для китайца — пиши её на упрощённом китайском отдельной строкой. ' +
  'На фото переведи весь текст; если это меню — объясни блюда. ' +
  'Адреса и места пиши отдельной строкой: 📍 <адрес или название по-китайски>. На вопрос, что есть рядом, — 📍 <поисковое слово по-китайски>. ' +
  'Если пользователь сообщил новый важный факт о себе или поездке, которого нет в памяти, добавь в конце строку: 🧠 <факт коротко>.';

async function ask(text, audio, photo) {
  if (!text && !audio && !photo) return;
  const started = generation;
  const u = add('user', text || (audio ? '🎤' : '📷'));
  if (photo) u.append(Object.assign(new Image(), {src: photo}));
  const content = [{type: 'text', text: text || (audio ? 'Ответь на голосовой вопрос.' : 'Что здесь написано? Переведи.')}];
  if (photo) content.push({type: 'image_url', image_url: {url: photo}});
  if (audio) content.push({type: 'input_audio', input_audio: {data: audio, format: 'wav'}});
  const a = add('bot', '…');
  try {
    const memory = $('mem').value.trim();
    const out = await llm([{role: 'system', content: ASSIST + (memory ? '\nПамять о пользователе и поездке:\n' + memory : '')},
      ...hist, {role: 'user', content: content.length > 1 ? content : content[0].text}], $('amodel').value,
      {reasoning: {effort: 'medium'}, tools: [{type: 'openrouter:web_search'}]},
      (t, thinking) => { if (started == generation) { a.textContent = t || (thinking ? '🤔 думаю…' : a.textContent); a.scrollIntoView(false); } });
    if (started != generation) return;
    const t = Date.now();
    u.entry = {cls: 'user', text: text || (audio ? '🎤' : '📷'), t};
    renderEntry({cls: 'bot', text: out, t, pin: false}, a); saveLog();
    hist.push({role: 'user', content: text || (audio ? '🎤 голосовой вопрос' : '📷 фото')}, {role: 'assistant', content: out});
    hist = hist.slice(-20); store('hist', hist);
    $('mem').value = remember($('mem').value, out); store('mem', $('mem').value);
  } catch (e) {
    if (started != generation) return;
    retry(a, e, () => { u.remove(); a.remove(); ask(text, audio, photo); });
  }
}

// Tap a reply to hear it. Mixed RU/ZH text → read only the Chinese part (that's what you show to a local).
let spoken;
function voiceFor(voices, lang) {
  const normalized = value => value.replace(/_/g, '-').toLowerCase();
  const target = normalized(lang), prefix = target.split('-')[0];
  const matches = voices.filter(v => normalized(v.lang) == target);
  const related = voices.filter(v => normalized(v.lang).split('-')[0] == prefix);
  return matches.find(v => v.localService) || matches[0] || related.find(v => v.localService) || related[0];
}

function speechStatus(text = '') {
  for (const id of ['speechStatus', 'cardSpeechStatus']) { $(id).textContent = text; $(id).hidden = !text; }
}

function voiceState() {
  const voices = window.speechSynthesis?.getVoices() || [];
  const state = lang => voiceFor(voices, lang) ? '✅' : '❌';
  $('voiceState').textContent = '中文: ' + ($('tts').value.trim() ? 'через API' : 'голос телефона ' + state('zh-CN')) + ' · русский: голос телефона ' + state('ru-RU');
}
$('testRu').onclick = () => say('Привет! Проверка русского голоса.', 'ru-RU');
$('testZh').onclick = () => say('你好！请问这个多少钱？', 'zh-CN');
window.speechSynthesis?.addEventListener('voiceschanged', voiceState);
$('settings').addEventListener('toggle', voiceState);
$('tts').addEventListener('change', voiceState);
voiceState();

// Chinese goes to the TTS API when set in ⚙ (phones often lack a decent Chinese voice); Russian stays on the phone,
// the Qwen voices speak only Chinese and English. iOS plays an <audio> later (when a translation arrives) without a
// tap only if that same element was first started by a tap — so one shared player, unlocked on the first activation.
const player = new Audio(), silence = URL.createObjectURL(new Blob([wav(new Float32Array(160), 16000)], {type: 'audio/wav'}));
let unlocked = false, sayId = 0;
for (const type of ['pointerup', 'touchend', 'click', 'keydown']) addEventListener(type, () => {
  if (unlocked || !player.paused || navigator.userActivation?.isActive === false) return; // never cut off a phrase
  player.src = silence; player.play().then(() => unlocked = true, () => {});
}, true);

function hush() { sayId++; player.pause(); window.speechSynthesis?.cancel(); }

// ponytail: every new phrase stays in Cache Storage (replays and offline bookmarks); prune if storage ever runs out.
async function speechFile(text) {
  const [model, voice] = $('tts').value.split(',').map(s => s.trim());
  const key = new Request('tts/' + encodeURIComponent([model, voice, text].join('|')));
  const cache = await window.caches?.open('china-trip-ai-tts').catch(() => null);
  const hit = await cache?.match(key);
  if (hit) return hit.blob();
  let r;
  try {
    r = await fetch($('url').value.trim().replace(/chat\/completions$/, 'audio/speech'), {
      method: 'POST', signal: AbortSignal.timeout(15000),
      headers: {Authorization: 'Bearer ' + $('key').value.trim(), 'Content-Type': 'application/json'},
      body: JSON.stringify({model, input: text, voice, response_format: 'mp3'}),
    });
  } catch (e) { throw new Error(e.name == 'TimeoutError' ? 'нет ответа 15 с' : 'нет связи'); }
  if (!r.ok || !r.headers.get('content-type')?.startsWith('audio/')) throw new Error(HTTP_ERRORS[r.status] || r.status + ' ' + (await r.text()).slice(0, 200));
  await cache?.put(key, r.clone()).catch(() => {});
  return r.blob();
}

async function say(text, lang) {
  if (!lang) {
    const zh = text.match(/[一-鿿][^\na-zа-яё]*/gi);
    lang = zh ? 'zh-CN' : 'ru-RU';
    if (zh) text = zh.join(' ');
  }
  hush(); speechStatus();
  if (lang.startsWith('zh') && $('tts').value.trim()) {
    const id = sayId;
    try {
      const audio = await speechFile(text);
      if (id != sayId) return;
      if (player.src != silence) URL.revokeObjectURL(player.src);
      player.src = URL.createObjectURL(audio);
      await player.play();
    } catch (e) {
      if (id == sayId) speechStatus('⚠️ Озвучка через API: ' + ({NotAllowedError: 'нажми 🔊 ещё раз', NotSupportedError: 'не удалось воспроизвести'}[e.name] || e.message));
    }
    return;
  }
  if (!('speechSynthesis' in window)) return speechStatus('⚠️ В этом браузере нет озвучки. Открой сайт в Chrome или Safari.');
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = lang;
  const voice = voiceFor(speechSynthesis.getVoices(), lang);
  if (voice) utterance.voice = voice;
  spoken = utterance; // Keep the utterance alive until playback ends.
  speechSynthesis.resume();
  utterance.onend = () => { if (spoken == utterance) spoken = null; };
  utterance.onerror = e => {
    if (spoken != utterance || ['canceled', 'interrupted'].includes(e.error)) return;
    const language = lang.startsWith('zh') ? 'китайский' : 'русский';
    const messages = {
      'not-allowed': 'Нажми 🔊 ещё раз — браузер не разрешил автоматическую озвучку.',
      'language-unavailable': 'Установи ' + language + ' голос в настройках телефона → Синтез речи → Установка голосовых данных.',
      'voice-unavailable': 'Выбранный голос недоступен. Проверь настройки телефона → Синтез речи.',
      'synthesis-unavailable': 'Синтезатор речи недоступен. Проверь настройки телефона → Синтез речи.',
      'synthesis-failed': 'Не удалось озвучить. Проверь ' + language + ' голос в настройках телефона → Синтез речи.',
      'network': 'Голосу нужна сеть. Для поездки скачай ' + language + ' голос в настройках телефона → Синтез речи.',
      'audio-busy': 'Звук занят другим приложением. Закрой его и нажми 🔊 ещё раз.',
      'audio-hardware': 'Проверь мультимедийную громкость и подключённые наушники.'
    };
    speechStatus('⚠️ ' + (messages[e.error] || 'Ошибка озвучки: ' + e.error));
    spoken = null;
  };
  try { speechSynthesis.speak(utterance); }
  catch { spoken = null; speechStatus('⚠️ Не удалось запустить озвучку. Проверь настройки телефона → Синтез речи.'); }
}

// Self-check: open index.html#test

  const fails = [], ok = (c, name) => c || fails.push(name);
  const tone = new Float32Array(48000).map((_, i) => Math.sin(i / 10) / 2);

  ok(back.sampleRate == 16000 && Math.abs(back.length - 16000) < 50, 'wav encode + resample');
  ok(parse('```json\n{"heard":"你好","tr":"Привет"}\n```').tr == 'Привет', 'parse fenced json');
  ok(parse('Привет', 'x').tr == 'Привет', 'parse plain fallback');
  const lines = cardLines({text: 'Подсказка\n\n📍 南京东路100号\n你好'});

  ok(cardLines({text: '📍 x'})[0].place == 'x', 'card place');
  const pins = [{pin: true, t: 1}, {pin: true, t: 2}], rest = Array.from({length: 305}, (_, t) => ({t: t + 3}));

  const q = '南京东路 100号&x=1';

  const memory = remember('Шанхай', 'Ответ\n🧠 Отель на Nanjing East Road\n🧠 Отель на Nanjing East Road');
  ok(memory == 'Шанхай\nОтель на Nanjing East Road' && remember(memory, '🧠 Отель на Nanjing East Road') == memory, 'memory deduplication');
  const now = Date.now(), sample = Array.from({length: 6}, (_, i) => ({cls: 'ru', heard: String(i), tr: '好', t: now - 1000}));
  sample.push({cls: 'zh', heard: 'old', tr: 'старое', t: now - 600001});
  ok(recentContext(sample, now) == sample.slice(2, 6).map(e => e.heard + ' → ' + e.tr).join('\n'), 'recent translation context');
  ok(readArray('missing-selftest-key').length == 0, 'missing storage');
  ok(yuan('Это 80 юаней / ¥80 · ￥12,5 · 1,500元 · 30 000 юаней · 3块蛋糕 · 5块钱').join() == '80,12.5,1500,30000,5', 'yuan amounts');
  ok(sourceLang('这个多少钱？', 'zh') == 'ru' && sourceLang('Сколько стоит?', 'ru') == 'zh' && sourceLang('OK', 'zh') == 'zh', 'any button');
  add(fails.length ? 'err' : 'bot', fails.length ? '❌ ' + fails.join(', ') : '✅ selftest ok');
  const voices = add('info', '');
  const showVoices = () => { const list = speechSynthesis.getVoices(); voices.textContent = 'голоса TTS: zh ' + (list.some(v => /^zh/i.test(v.lang)) ? '✅' : '❌') + ' ru ' + (list.some(v => /^ru/i.test(v.lang)) ? '✅' : '❌'); };
  showVoices(); speechSynthesis.addEventListener('voiceschanged', showVoices);
})();
</script>
